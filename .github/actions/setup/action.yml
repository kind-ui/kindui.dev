name: Setup
description: Node from .nvmrc, the npm version in packageManager, and `npm ci`.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        check-latest: true
        cache: npm
    - shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"
    - shell: bash
      run: npm ci
